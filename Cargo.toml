[package]
name = "rust-template-output"
version = "0.1.0"
edition = "2024"
default-run = "rust-template-output"
rust-version = "1.85.1"

[features]
test_feature_1 = []

[dependencies]
bytes = "1.12.1"
derive_builder = "0.20.2"
either = "1.18.0"
futures = "0.3.34"
gratte = "2.0.0"
mockall_double = "0.3.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
anyhow = "1.0.104"
assert_matches = "1.5.0"
itertools = "0.15.0"
mockall = "0.15.0"
serial_test = "4.0.1"
wiremock = "0.6.5"
wiremock_logical_matchers = "0.6.2"
